(function(){var p=location.pathname.toLowerCase().replace(/\/+$/,'');

<script>
(()=>{const t=[...document.querySelectorAll('[data-es]')];t.forEach(e=>e.dataset.en=e.innerHTML);let l='en';const b=document.getElementById('language');
function s(v){l=v;document.documentElement.lang=v;t.forEach(e=>e.innerHTML=e.dataset[v]);b.textContent=v==='en'?'ES':'EN';b.setAttribute('aria-label',v==='en'?'Cambiar a español':'Switch to English');try{localStorage.setItem('estar-language',v)}catch{}}
b.addEventListener('click',()=>s(l==='en'?'es':'en'));try{if(localStorage.getItem('estar-language')==='es')s('es')}catch{}})();
</script>
